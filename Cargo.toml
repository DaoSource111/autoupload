[workspace]
members = ["crates/core", "crates/cli", "crates/gui", "tools/site"]
resolver = "2"

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"
authors = ["Ellipsio Studio"]
repository = "https://github.com/DaoSource111/autoupload"
rust-version = "1.80"

[workspace.dependencies]
autoupload-core = { path = "crates/core" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
open = "5"
rand = "0.8"
base64 = "0.23"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
unicode-normalization = "0.1"
url = "2"
slint = "1"
slint-build = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
