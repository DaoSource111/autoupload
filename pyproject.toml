[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoupload"
version = "1.1.0"
description = "Upload and schedule videos on one or more YouTube channels with the official YouTube Data API v3"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "google-api-python-client>=2.100",
  "google-auth>=2.20",
  "google-auth-oauthlib>=1.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "tzdata; sys_platform == 'win32'",  # time zone names (Europe/Madrid) on Windows, which has no system database
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
autoupload = "autoupload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
