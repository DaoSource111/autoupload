name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: the CLI and the MCP server work in demo mode (no network)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p autoupload
          bin=target/debug/autoupload
          $bin --demo channels --json | grep -q '"lumen-lab"'
          $bin --demo queue lumen-lab --json | grep -q '"ready"'
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","clientInfo":{"name":"ci","version":"1"},"capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"plan","arguments":{"channel":"lumen-lab"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"upload","arguments":{"channel":"lumen-lab"}}}' \
            | $bin --demo mcp > mcp.out
          cat mcp.out
          grep -q '"protocolVersion":"2025-06-18"' mcp.out
          grep '"id":2' mcp.out | grep -q '"isError":false'
          grep '"id":3' mcp.out | grep -q 'may not upload'
      - name: the website is up to date with its sources
        if: runner.os == 'Linux'
        run: |
          cargo run -q -p autoupload-site
          git diff --exit-code -- docs
