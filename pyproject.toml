[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subidor-youtube"
version = "1.0.0"
description = "Sube y programa vídeos en uno o varios canales de YouTube con la API oficial Data v3"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "google-api-python-client>=2.100",
  "google-auth>=2.20",
  "google-auth-oauthlib>=1.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
subidor = "subidor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
