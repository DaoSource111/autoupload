name: Release

# Pushing a tag such as v2.0.0 runs the tests, builds the CLI and the desktop app for Windows, Linux and macOS,
# attests their provenance and publishes a GitHub release whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: tag must match the workspace version
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag version=$version"
          test "$tag" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: the version has a dated CHANGELOG section
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\] — [0-9]" CHANGELOG.md

  build:
    needs: check
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "AutoUpload-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/autoupload.exe", "target/${{ matrix.target }}/release/autoupload-gui.exe" $dir
          Copy-Item README.md, LICENSE, CHANGELOG.md, install-task.ps1, upload-all.ps1 $dir
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path $dir -DestinationPath "dist/$dir.zip"

      - name: package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="AutoUpload-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir" dist
          cp target/${{ matrix.target }}/release/autoupload target/${{ matrix.target }}/release/autoupload-gui "$dir/"
          cp packaging/linux/autoupload.desktop packaging/linux/install.sh README.md LICENSE CHANGELOG.md "$dir/"
          cp assets/brand/autoupload-logo-rounded-512.png "$dir/autoupload.png"
          chmod +x "$dir/install.sh"
          tar -czf "dist/$dir.tar.gz" "$dir"

      - name: package (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="AutoUpload-$VERSION-${{ matrix.name }}"
          app="$dir/AutoUpload.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp target/${{ matrix.target }}/release/autoupload-gui target/${{ matrix.target }}/release/autoupload "$app/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          set=AutoUpload.iconset; mkdir "$set"
          src=assets/brand/autoupload-logo-rounded-512.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "$set/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d "$src" --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/AutoUpload.icns"
          codesign --force --deep -s - "$app"
          ln -s ../AutoUpload.app/Contents/MacOS/autoupload "$dir/autoupload"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          ditto -c -k --keepParent --sequesterRsrc "$dir" "dist/$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip, dist/*.tar.gz"
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Downloads:** Windows `windows-x64.zip` · Linux `linux-x64.tar.gz` · macOS `macos-arm64.zip` (Apple silicon) or `macos-x64.zip` (Intel).
          The builds are not code-signed yet: on Windows choose *More info → Run anyway*; on macOS right-click AutoUpload.app → *Open* the first time.
          NOTES
          printf '\nVerify a download: `sha256sum -c SHA256SUMS`, or `gh attestation verify <file> --repo %s`.\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "AutoUpload ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
