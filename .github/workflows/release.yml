name: Release

# Pushing a tag such as v1.2.0 builds the package, checks it, attests its provenance and publishes a GitHub release
# whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release
  id-token: write       # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: build wheel and sdist
        run: |
          python -m pip install build
          python -m build
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\n---\nVerify a download: `sha256sum -c SHA256SUMS`, or `gh attestation verify <file> --repo %s`.\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md

      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "AutoUpload ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
